[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multipgs"
dynamic = ["version"]                # single-sourced from multipgs.__version__
description = "Multivariate polygenic scoring: combine many polygenic scores into one, built on ldpred3"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bjarni Vilhjálmsson" }]
# ldpred3 supplies genotype I/O, allele harmonisation, the LDpred model behind
# panel_from_sumstats, and the shared LD/weight interoperability contracts.
#
# The 0.5 line supplies the public interoperability layer used for cache,
# harmonisation, LD-representation and weight contracts; 0.5.3.dev0 adds
# ldpred3.shim, the published code-level surface multipgs/_numba.py binds its
# Numba decorators through. These private sibling packages are installed from
# coordinated Git checkouts; the range lets pip verify that the checkouts
# really belong to the same API generation.
dependencies = ["numpy>=1.20", "ldpred3>=0.5.3.dev0,<0.6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/bvilhjal/multipgs"
Repository = "https://github.com/bvilhjal/multipgs"
Issues = "https://github.com/bvilhjal/multipgs/issues"
Documentation = "https://github.com/bvilhjal/multipgs#documentation"

[project.scripts]
multipgs = "multipgs.cli:main"

[project.optional-dependencies]
fast = ["ldpred3[fast]>=0.5.3.dev0,<0.6"]
bipred = ["bipred>=0.3.9.dev0,<0.4"]
test = ["pytest>=7", "scikit-learn>=1.0", "pypdf>=5"]
lint = ["ruff>=0.5"]

[tool.setuptools]
packages = ["multipgs"]

[tool.setuptools.data-files]
"share/doc/multipgs" = [
    "CONTRIBUTING.md",
    "report/README.md",
    "report/evidence.json",
    "report/generate_evidence.py",
    "report/generated_evidence.tex",
    "report/multipgs_methods.tex",
    "report/multipgs_methods.pdf",
    "report/multipgs_methods.pdf.sha256",
]
"share/doc/multipgs/docs" = [
    "docs/algorithm.md",
    "docs/api.md",
    "docs/guide.md",
    "docs/references.md",
    "docs/theory.md",
]

[tool.setuptools.dynamic]
version = { attr = "multipgs.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Lint for real defects, not style: like ldpred3 and bipred, this codebase uses
# compact multi-statement lines (E702) and long lines, so enforce only
# pyflakes (F).
target-version = "py39"

[tool.ruff.lint]
select = ["F"]
