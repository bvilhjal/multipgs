name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bvilhjal/ldpred3
          ref: dcde5737f720642105c0e1c79878219304fa3012
          path: ldpred3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "./ldpred3[fast]"
      - run: python -m pip install ".[fast,test,lint]"
      - run: python -m ruff check .
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine numpy
      - uses: actions/checkout@v4
        with:
          repository: bvilhjal/ldpred3
          ref: dcde5737f720642105c0e1c79878219304fa3012
          path: ldpred3
      - run: python report/generate_evidence.py --check
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check distribution content
        shell: python
        run: |
          import glob
          import tarfile
          import zipfile

          archive, = glob.glob("dist/*.tar.gz")
          with tarfile.open(archive) as source:
              names = source.getnames()
          for path in ("CHANGELOG.md", "CONTRIBUTING.md", "docs/guide.md",
                       "docs/api.md", "examples/minimal.py",
                       "benchmarks/README.md", "benchmarks/meta_rules.py",
                       "benchmarks/results/meta_rules.csv",
                       "benchmarks/stack_scaling.py",
                       "benchmarks/results/stack_scaling.csv",
                       "benchmarks/sumstat_calibration.py",
                       "benchmarks/results/sumstat_calibration.csv",
                       "benchmarks/results/sumstat_calibration_summary.csv",
                       "benchmarks/results/sumstat_calibration_provenance.json",
                       "report/README.md", "report/evidence.json",
                       "report/generate_evidence.py",
                       "report/generated_evidence.tex",
                       "report/multipgs_methods.tex",
                       "report/multipgs_methods.pdf",
                       "tests/test_api.py"):
              assert any(name.endswith("/" + path) for name in names), path

          # Every checked benchmark producer and result is distribution
          # evidence. Keep this dynamic so adding a result cannot silently
          # bypass the older hand-written representative list above.
          # tests/ is the suite the methods report treats as committed
          # evidence; the changelog has claimed it ships since 0.2.0.
          expected = (glob.glob("benchmarks/*.py")
                      + glob.glob("benchmarks/results/*.csv")
                      + glob.glob("benchmarks/results/*.json")
                      + glob.glob("tests/*.py"))
          for path in expected:
              path = path.replace("\\", "/")
              assert any(name.endswith("/" + path) for name in names), path

          # MANIFEST.in must not turn a developer's ignored real-data inputs or
          # scratch runs into release payload. A clean CI checkout cannot test
          # their presence, so also reject their path patterns explicitly.
          forbidden_parts = {".work", ".runs", ".ld_cache", "__pycache__"}
          for name in names:
              relative = name.split("/", 1)[-1]
              parts = set(relative.split("/"))
              if relative.startswith("benchmarks/"):
                  assert not (parts & forbidden_parts), relative
                  assert not any(part.startswith((".scores", ".ldref"))
                                 for part in parts), relative
                  assert not relative.endswith((".log", ".npz", ".npy")), relative

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as package:
              names = package.namelist()
          for path in ("share/doc/multipgs/CONTRIBUTING.md",
                       "share/doc/multipgs/README.md",
                       "share/doc/multipgs/evidence.json",
                       "share/doc/multipgs/generate_evidence.py",
                       "share/doc/multipgs/generated_evidence.tex",
                       "share/doc/multipgs/multipgs_methods.tex",
                       "share/doc/multipgs/multipgs_methods.pdf",
                       "share/doc/multipgs/docs/guide.md",
                       "share/doc/multipgs/docs/api.md"):
              assert any(name.endswith(path) for name in names), path
          for path in ("multipgs/__init__.py", "multipgs/cli.py",
                       "multipgs/sumstat.py"):
              assert path in names, path
      - name: Install and smoke-test the built wheel
        shell: bash
        run: |
          python -m pip install "./ldpred3"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          checkout="$PWD"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python -c "import importlib.metadata, pathlib, sysconfig, multipgs; source=pathlib.Path(multipgs.__file__).resolve(); purelib=pathlib.Path(sysconfig.get_paths()['purelib']).resolve(); assert pathlib.Path('$checkout').resolve() not in source.parents, source; assert purelib in source.parents, (source, purelib); assert importlib.metadata.version('multipgs') == multipgs.__version__"
          multipgs --version
          python "$checkout/examples/minimal.py"
